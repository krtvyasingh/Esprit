[package]
publish = false
name = "esprit-cli"
version.workspace = true
edition.workspace = true
description = "Esprit AI workspace component"
license = "MIT"
repository = "https://github.com/krtvyasingh/Esprit"
homepage = "https://github.com/krtvyasingh/Esprit"
documentation = "https://github.com/krtvyasingh/Esprit"
readme = "README.md"

[[bin]]
name = "esprit"
path = "src/main.rs"

[dependencies]
anyhow.workspace       = true
clap.workspace         = true
indicatif.workspace    = true
owo-colors.workspace   = true
tracing.workspace      = true

esprit-core       = { version = "0.1.0", path = "../../crates/esprit-core" }
esprit-config     = { version = "0.1.0", path = "../../crates/esprit-config" }
esprit-platform   = { version = "0.1.0", path = "../../crates/esprit-platform" }
esprit-search     = { version = "0.1.0", path = "../../crates/esprit-search" }
esprit-filesystem = { version = "0.1.0", path = "../../crates/esprit-filesystem" }
esprit-index      = { version = "0.1.0", path = "../../crates/esprit-index" }
esprit-ai         = { version = "0.1.0", path = "../../crates/esprit-ai" }
esprit-rag        = { version = "0.1.0", path = "../../crates/esprit-rag" }
esprit-agents     = { version = "0.1.0", path = "../../crates/esprit-agents" }
esprit-workflows  = { version = "0.1.0", path = "../../crates/esprit-workflows" }
esprit-memory     = { version = "0.1.0", path = "../../crates/esprit-memory" }
esprit-telemetry  = { version = "0.1.0", path = "../../crates/esprit-telemetry" }
esprit-models     = { version = "0.1.0", path = "../../crates/esprit-models" }
esprit-codeintel  = { version = "0.1.0", path = "../../crates/esprit-codeintel" }
esprit-security   = { version = "0.1.0", path = "../../crates/esprit-security" }
esprit-cleaner    = { version = "0.1.0", path = "../../crates/esprit-cleaner" }
ratatui = "0.30.2"
crossterm = "0.29.0"
rusqlite = { workspace = true, features = ["bundled"] }
esprit-vectors = { version = "0.1.0", path = "../../crates/esprit-vectors" }
notify.workspace = true
esprit-plugins = { version = "0.1.0", path = "../../crates/esprit-plugins" }
esprit-embeddings = { version = "0.1.0", path = "../../crates/esprit-embeddings" }
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
walkdir.workspace = true
