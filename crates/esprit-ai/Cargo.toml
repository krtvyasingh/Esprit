[package]
publish = false
name    = "esprit-ai"
version.workspace = true
edition.workspace = true
description = "Esprit local AI inference (llama.cpp backend — no Ollama required)"
license = "MIT"
repository = "https://github.com/krtvyasingh/Esprit"

[dependencies]
anyhow.workspace      = true
encoding_rs           = "0.8"
esprit-models         = { version = "0.1.0", path = "../esprit-models" }

# llama.cpp Rust bindings — compiles llama.cpp from source at build time.
# Metal acceleration is enabled automatically on Apple Silicon.
# CPU fallback is used on all other platforms.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1" }
