[package]
publish = false
name = "esprit-platform"
version.workspace = true
edition.workspace = true
description = "Esprit AI workspace component"
license = "MIT"
repository = "https://github.com/krtvyasingh/Esprit"
homepage = "https://github.com/krtvyasingh/Esprit"
documentation = "https://github.com/krtvyasingh/Esprit"
readme = "README.md"

[dependencies]
anyhow.workspace    = true
sysinfo.workspace   = true
notify.workspace    = true
tracing.workspace   = true
reqwest = { version = "0.12", default-features = false, features = ["blocking","json","rustls-tls"] }

crossbeam-channel = "0.5"

esprit-index = { version = "0.1.0", path = "../esprit-index" }
