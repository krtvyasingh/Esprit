[package]
publish = false
name    = "esprit-embeddings"
version.workspace = true
edition.workspace = true
description = "Esprit local embeddings via llama.cpp (no Ollama required)"
license = "MIT"
repository = "https://github.com/krtvyasingh/Esprit"

[dependencies]
anyhow.workspace  = true
esprit-models     = { version = "0.1.0", path = "../esprit-models" }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1" }
