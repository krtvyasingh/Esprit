[workspace]
resolver = "2"

members = [
    "apps/esprit-cli",
    "crates/esprit-core",
    "crates/esprit-config",
    "crates/esprit-filesystem",
    "crates/esprit-search",
    "crates/esprit-rag",
    "crates/esprit-memory",
    "crates/esprit-agents",
    "crates/esprit-workflows",
    "crates/esprit-plugins",
    "crates/esprit-vectors",
    "crates/esprit-codeintel",
    "crates/esprit-daemon",
    "crates/esprit-api",
    "crates/esprit-core-index",
    "crates/esprit-production",
    "desktop",
    "crates/esprit-embeddings",
    "crates/esprit-index",
    "crates/esprit-ai",
    "crates/esprit-platform",
    "crates/esprit-telemetry",
    "crates/esprit-cache",
    "crates/esprit-storage",
    "crates/esprit-jobs",
    "crates/esprit-pipeline",
    "crates/esprit-utils",
    "crates/esprit-security",
    "crates/esprit-package", "crates/esprit-app",
    "crates/esprit-models",
    "crates/esprit-cleaner",
]

default-members = [
    "apps/esprit-cli",
]

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kartavya Singh"]
rust-version = "1.97.1"

[workspace.dependencies]
hex = "0.4.3"
dashmap = "6"

anyhow = "1"

clap = { version = "4.5", features = ["derive"] }

serde = { version = "1", features = ["derive"] }

serde_json = "1"

toml = "0.9"

walkdir = "2"

ignore = "0.4"

globset = "0.4"

regex = "1"

rayon = "1"

sha2 = "0.11"

chrono = { version = "0.4", features = ["serde"] }

camino = "1"

directories = "6"

once_cell = "1"

parking_lot = "0.12"

thiserror = "2"

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sysinfo = "0.37"

indicatif = "0.18"

owo-colors = "4"

notify = "8"

rusqlite = { version = "0.37", features = ["bundled"] }

tantivy = "0.25"

tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
